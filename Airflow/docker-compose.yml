services:
  db:
    image: mysql:8
    container_name: market_etl
    env_file:
      - ../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${root_passwd}
      MYSQL_DATABASE: app_db
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_user_pass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
